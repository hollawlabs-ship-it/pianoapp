name: Deploy to GitHub Pages

# 빌드 도구가 없는 정적 앱이라 소스를 그대로 올린다.
# main에 푸시하면 gh-pages로 그대로 밀어넣고, 깃허브가 그 브랜치를 서빙한다.
#
# 왜 actions/deploy-pages 가 아니라 브랜치 방식인가:
# 저장소의 Pages Source가 "Deploy from a branch (gh-pages)"로 잡혀 있다.
# deploy-pages는 Source가 "GitHub Actions"일 때만 동작하므로 여기서는 쓸 수 없다.
# 브랜치 방식은 저장소 설정을 건드릴 필요가 없다는 장점도 있다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 배포는 한 번에 하나만. 진행 중인 것은 취소하지 않고 끝나게 둔다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 배포 아티팩트 점검
        run: |
          set -e
          test -f index.html    || { echo "index.html 없음"; exit 1; }
          test -f manifest.json || { echo "manifest.json 없음"; exit 1; }
          test -f sw.js         || { echo "sw.js 없음"; exit 1; }
          test -f .nojekyll     || { echo ".nojekyll 없음 — Jekyll이 파일을 건드릴 수 있음"; exit 1; }
          # 서비스 워커의 캐시 버전과 앱 버전이 어긋나면 낡은 자산이 남는다
          APP_V=$(grep -oE "PA\.VERSION = '[^']+'" js/core/util.js | grep -oE "v[0-9.]+")
          SW_V=$(grep -oE "VERSION = '[^']+'" sw.js | grep -oE "v[0-9.]+")
          echo "app=$APP_V sw=$SW_V"
          test "$APP_V" = "$SW_V" || { echo "버전 불일치: util.js($APP_V) != sw.js($SW_V)"; exit 1; }

      - name: gh-pages로 배포
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 자격증명을 명시한다. checkout이 심어둔 헤더에 의존하지 않는다.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # gh-pages는 main의 거울이다. 갈라질 일이 없으므로 강제로 맞춘다.
          git push --force "$REMOTE" HEAD:gh-pages

      - name: 배포 확인
        run: |
          set -e
          URL="https://hollawlabs-ship-it.github.io/pianoapp/"
          # 깃허브가 브랜치를 반영하는 데 시간이 걸린다. 버전이 바뀔 때까지 기다린다.
          WANT=$(grep -oE "PA\.VERSION = '[^']+'" js/core/util.js | grep -oE "v[0-9.]+")
          for i in $(seq 1 20); do
            GOT=$(curl -fsS "${URL}js/core/util.js?cb=$i" 2>/dev/null \
                  | grep -oE "PA\.VERSION = '[^']+'" | grep -oE "v[0-9.]+" || true)
            if [ "$GOT" = "$WANT" ]; then echo "배포 확인: $GOT"; exit 0; fi
            echo "대기 중… (받은 값: ${GOT:-없음}, 기대: $WANT)"
            sleep 15
          done
          echo "5분 안에 새 버전이 서빙되지 않았습니다."
          exit 1
